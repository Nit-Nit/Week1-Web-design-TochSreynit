<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
        background-color: #f8f5f0;
        margin: 0;
        padding: 30px;
      }
      .pricing-container {
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 25px;
        margin: 50px auto;
      }

      .pricing-plan {
        background-color: #fffdf9;
        padding: 30px;
        border-radius: 18px;
        text-align: center;
        flex: 1;
        max-width: 250px;
        box-shadow: 0 8px 20px rgba(91, 65, 48, 0.12);
        border: 1px solid #e8ded2;
      }

      .plan-title {
        font-size: 23px;
        font-weight: bold;
        color: #705746;
      }

      .plan-price {
        font-size: 27px;
        font-weight: bold;
        color: #a47c61;
        margin: 20px 0;
      }

      .plan-features {
        list-style: none;
        padding: 0;
        line-height: 2.5;
        color: #796e64;
        font-size: 14px;
        text-align: left;
        width: fit-content;
        margin: 20px auto;
      }

      .plan-button {
        background-color: #a47c61;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 25px;
        cursor: pointer;
        font-family: "Sono", sans-serif;
      }

      .pricing-plan:nth-child(2) {
        background-color: #f0eee5;
      }

      .pricing-plan:nth-child(2) .plan-button {
        background-color: #89947a;
      }

      .pricing-plan:nth-child(3) {
        background-color: #f4e9e5;
      }

      .pricing-plan:nth-child(3) .plan-button {
        background-color: #b77f76;
      }

      .plan-button:hover {
        opacity: 0.8;
      }


      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
            flex-direction: column;
            align-items: center;
        }
        .pricing-plan {
            width: 80%;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
