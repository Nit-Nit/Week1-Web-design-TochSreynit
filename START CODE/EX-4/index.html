<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Profile card</title>
    <link rel="stylesheet" href="style.css">
     <link rel="stylesheet" href=
"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
     <div class = "body">
        <div class = "photo-card">
            <div class = "profile">
                <div class="profile-image">
                   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmQPB-DHaThYVi9HSfAR50pRQUuc6ljexpskZyq7cMVA&s=10" alt="ahn keonho" class="profile-pic">
                </div>
                
                <div class="profile-info">
                    <h1>Ahn Keonho</h1>
                </div>
                <div class = "job">
                    <p>Artist</p>
                </div>
            </div>
            <div class="stats-container">
                <div class="stats">
                    <span class="stat-label">Posts</span>
                    <span class="stat-value">10</span>
                </div>
                <div class="stats">
                    <span class="stat-label">Followers</span>
                    <span class="stat-value">10M</span>
                </div>
                <div class="stats">
                    <span class="stat-label">Following</span>
                    <span class="stat-value">0</span>
                </div>
            </div>
            <div class="bio">
                <p> CORTIS
                CORTIS 코르티스 Official Instagram
                ‘GREENGREEN_playextended’ out now!
                </p>
            </div>
            <div class=" social">   
                <a href="#" class="social-icon"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="social-icon"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="social-icon"><i class="fa-brands fa-tiktok"></i></a>
            </div>
            <button class="follow-button">View Profile</button>
        </div>
    </div>
</body>
</html>
